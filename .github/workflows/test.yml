name: Verify bridge
on: [push, pull_request]
permissions:
  contents: read
jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: python3 -m unittest discover -s test -p '*_test.py'
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
  cosmic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: bridge
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: P0nk/Cosmic
          ref: fec53bc7714dc0f1ae3f50b2986cdf2727e0912a
          path: cosmic
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: python bridge/tools/install-cosmic.py cosmic --check
      - run: python bridge/tools/install-cosmic.py cosmic
      - run: bash ./mvnw test
        working-directory: cosmic
  managed-cosmic:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      matrix:
        include:
          - profile: collectibles
            options: ""
            lines: 1
          - profile: series-one
            options: "--series-one"
            lines: 1
          - profile: custom-catalog
            options: '--catalog "$RUNNER_TEMP/custom-catalog.json"'
            lines: 2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Prepare a distinct original custom collection
        if: matrix.profile == 'custom-catalog'
        run: |
          python3 - <<'PY'
          import copy, json, os
          from pathlib import Path
          catalog = json.loads(Path("data/catalog.example.json").read_text(encoding="utf-8"))
          catalog["name"] = "Two original shape collections"
          catalog["lines"].append({"id": "custom-shapes", "name": "Custom shapes"})
          variants = {}
          for original in list(catalog["cards"]):
              card = copy.deepcopy(original)
              card["id"] = "custom-" + original["id"]
              card["lineId"] = "custom-shapes"
              catalog["cards"].append(card)
          for original in list(catalog["variants"]):
              variant = copy.deepcopy(original)
              variant["id"] = "custom-" + original["id"]
              variant["cardId"] = "custom-" + original["cardId"]
              variants[original["id"]] = variant["id"]
              catalog["variants"].append(variant)
          product = copy.deepcopy(catalog["products"][0])
          product.update(id="custom-shapes", lineId="custom-shapes", name="Custom shapes")
          product["price"]["amount"] = 1200
          for slot in product["slots"]:
              for entry in slot["pool"]:
                  entry["variantId"] = variants[entry["variantId"]]
          catalog["products"].append(product)
          Path(os.environ["RUNNER_TEMP"], "custom-catalog.json").write_text(json.dumps(catalog), encoding="utf-8")
          PY
      - name: Install a complete fresh Cosmic deployment
        run: |
          umask 077
          python3 tools/cosmic.py --directory "$RUNNER_TEMP/CosmicCardServer" install --test-account ${{ matrix.options }}
      - name: Check funding retries and readiness
        run: |
          python3 tools/cosmic.py --directory "$RUNNER_TEMP/CosmicCardServer" account fund CardTest --cash-type 4 --amount 5000 --request-id setup-funding-v1
          python3 tools/cosmic.py --directory "$RUNNER_TEMP/CosmicCardServer" doctor
      - name: Restart and verify persistent issued cards
        run: |
          python3 tools/cosmic.py --directory "$RUNNER_TEMP/CosmicCardServer" stop
          python3 tools/cosmic.py --directory "$RUNNER_TEMP/CosmicCardServer" start
          python3 tools/cosmic.py --directory "$RUNNER_TEMP/CosmicCardServer" smoke
      - name: Qualify owner administration, commerce, mutation restore, lease recovery and disaster rollback
        run: python3 test/managed-lifecycle.py "$RUNNER_TEMP/CosmicCardServer" --sandbox-root "$RUNNER_TEMP" --expected-lines ${{ matrix.lines }}
      - name: Remove the disposable deployment
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/CosmicCardServer/compose.json" ]; then
            docker compose -f "$RUNNER_TEMP/CosmicCardServer/compose.json" down --volumes --remove-orphans
          fi
          if [ -f "$RUNNER_TEMP/RecoveredCardServer/compose.json" ]; then
            docker compose -f "$RUNNER_TEMP/RecoveredCardServer/compose.json" down --volumes --remove-orphans
          fi
